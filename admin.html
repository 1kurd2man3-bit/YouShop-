<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت YouShop</title><link rel="stylesheet" href="/admin.css"></head><body><main class="wrap"><header><div class="brand"><span class="logo">Y</span><div><h1>YouShop</h1><p>پنل مدیریت فروشگاه</p></div></div><button id="logout" class="btn ghost hidden">خروج</button></header><section id="login" class="card login"><h2>ورود مدیر</h2><p>برای مدیریت محصولات و سفارش‌ها رمز عبور مدیر را وارد کنید.</p><form id="loginForm"><label>رمز عبور<input id="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">ورود به پنل</button><div id="loginError" class="error"></div></form></section><section id="dashboard" class="hidden"><div class="stats"><article class="card"><span>محصولات</span><strong id="countProducts">۰</strong></article><article class="card"><span>کل سفارش‌ها</span><strong id="countOrders">۰</strong></article><article class="card"><span>سفارش‌های جدید</span><strong id="countPending">۰</strong></article><article class="card"><span>فروش تکمیل‌شده</span><strong id="countRevenue">۰ ریال</strong></article></div><nav class="tabs"><button class="tab active" data-tab="products">مدیریت محصولات</button><button class="tab" data-tab="orders">سفارش‌ها</button></nav><section id="productsPanel" class="card"><div class="sectionhead"><h2>محصولات</h2><button id="showAdd" class="btn">+ افزودن محصول</button></div><form id="productForm" class="product-form hidden"><h3 id="formTitle">محصول جدید</h3><input type="hidden" id="productId"><div class="grid"><label>نام محصول *<input id="name" required maxlength="150"></label><label>دسته‌بندی *<input id="category" required placeholder="مثلاً موبایل"></label><label>قیمت به ریال *<input id="price" type="number" min="0" required></label><label>قیمت قبلی<input id="oldPrice" type="number" min="0"></label><label>موجودی<input id="stock" type="number" min="0" value="0" required></label><label>لینک تصویر<input id="image" type="url" placeholder="https://..."></label></div><label>توضیحات<textarea id="description" rows="3"></textarea></label><div class="actions"><button class="btn" type="submit">ذخیره محصول</button><button class="btn ghost" type="button" id="cancelForm">انصراف</button></div><div id="productError" class="error"></div></form><div id="productsList" class="tablewrap"></div></section><section id="ordersPanel" class="card hidden"><h2>سفارش‌ها</h2><div id="ordersList" class="tablewrap"></div></section><p id="toast" class="toast"></p></section><footer>© YouShop · ایمیل پشتیبانی: youshop.1405@gmail.com · <a href="https://t.me/Youshop123" target="_blank" rel="noopener">تلگرام</a></footer></main><script src="/admin.js"></script></body></html>
